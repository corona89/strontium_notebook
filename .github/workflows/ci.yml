name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  analyze-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Linux desktop toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang g++ cmake ninja-build pkg-config libgtk-3-dev libstdc++-dev

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Build Linux
        run: flutter build linux --release
